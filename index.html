/* ===== Уровни ===== */
var LV = [0,100,250,450,700,1000,1400,1900,2500,3200];
var TITLES = ["Интерн","Ординатор","Врач-стажёр","Участковый врач","Врач скорой помощи","Заведующий отделением","Заместитель главврача","Главный врач","Директор медцентра","Основатель сети клиник"];
function levelOf(xp){ var l = 1; for (var i=0;i<LV.length;i++){ if (xp >= LV[i]) l = i+1; } return l; }

/* ===== Клиника: комнаты, оборудование по уровням, доход в час и бонусы ===== */
var ROOMS = [
 { id:"reg",   ab:"РЕГ", name:"Регистратура",        min:1, tiers:[["Стойка и картотека",0],["Электронная запись",300],["Колл-центр",1200]], inc:[20,40,70],      perk:{t:"money", v:[3,6,10],  txt:"к деньгам за ответы"} },
 { id:"ther",  ab:"ТЕР", name:"Кабинет терапевта",   min:1, tiers:[["Тонометр и фонендоскоп",400],["Пульсоксиметр и ЭКГ",1000],["Кардиомонитор",2500]], inc:[50,100,180] },
 { id:"proc",  ab:"ПРО", name:"Процедурный кабинет", min:2, tiers:[["Кушетка и стерилизатор",900],["Инфузомат",1800],["Дефибриллятор",3500]], inc:[70,130,230] },
 { id:"lab",   ab:"ЛАБ", name:"Лаборатория",         min:3, tiers:[["Центрифуга",2200],["Биохимический анализатор",4500],["ПЦР-модуль",8000]], inc:[90,170,300], perk:{t:"hint", v:[1,2,3], txt:"подсказок 50/50 за смену"} },
 { id:"pharm", ab:"АПТ", name:"Аптека",              min:3, tiers:[["Витрина",1500],["Склад",3000],["Автоматизированный учёт",5500]], inc:[60,110,200], perk:{t:"time", v:[2,4,6], txt:"сек. к таймеру вопроса"} },
 { id:"us",    ab:"УЗИ", name:"Кабинет УЗИ",         min:4, tiers:[["УЗИ-аппарат",4000],["Допплер",7000],["Аппарат экспертного класса",12000]], inc:[120,220,380] },
 { id:"xray",  ab:"РЕН", name:"Рентген",             min:5, tiers:[["Рентген-аппарат",7000],["Цифровой детектор",12000],["Компьютерный томограф",24000]], inc:[200,360,650] },
 { id:"ward",  ab:"СТА", name:"Стационар",           min:6, tiers:[["Две койки",9000],["Пост медсестры",14000],["Палата на 8 коек",22000]], inc:[260,450,800] },
 { id:"icu",   ab:"РЕА", name:"Реанимация",          min:7, tiers:[["Монитор и аппарат ИВЛ",15000],["Блок на 4 места",26000],["Отделение с круглосуточным постом",42000]], inc:[300,520,900], perk:{t:"life", v:[1,1,2], txt:"к числу жизней"} },
 { id:"op",    ab:"ОПЕ", name:"Операционная",        min:8, tiers:[["Операционный стол",25000],["Лапароскопическая стойка",40000],["Роботизированный комплекс",70000]], inc:[500,900,1600], perk:{t:"money", v:[5,10,15], txt:"к деньгам за ответы"} }
];
var CAP_H = 8;

/* ===== Сохранение ===== */
var SAVE_KEY = "duty-save-v2", BANK_KEY = "duty-bank-v2";
function newSave(){ return { money: 250, xp: 0, rooms: { reg: 1 }, last: Date.now(), name: "Городская клиника", best: 0 }; }
var S;
function load(){
  try { var raw = localStorage.getItem(SAVE_KEY); if (raw){ var o = JSON.parse(raw); var d = newSave(); for (var k in d){ if (o[k] === undefined) o[k] = d[k]; } return o; } } catch(e){}
  return newSave();
}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} }
var CUSTOM = [];
function loadBank(){ try { var raw = localStorage.getItem(BANK_KEY); if (raw) return JSON.parse(raw) || []; } catch(e){} return []; }
function saveBank(){ try { localStorage.setItem(BANK_KEY, JSON.stringify(CUSTOM)); return true; } catch(e){ return false; } }
S = load(); CUSTOM = loadBank();

/* ===== Вспомогательное ===== */
var app = document.getElementById("app");
var view = "play", cat = "Все", st = null, timer = null, ticker = null, flash = "";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(n){ return Math.round(n).toLocaleString("ru-RU"); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pool(){ return BASE.concat(CUSTOM); }
function cats(){ var s = ["Все"]; pool().forEach(function(q){ if (s.indexOf(q.c)<0) s.push(q.c); }); return s; }
function tier(id){ return S.rooms[id] || 0; }
function perk(type){ var sum = 0; ROOMS.forEach(function(r){ var t = tier(r.id); if (t>0 && r.perk && r.perk.t===type) sum += r.perk.v[t-1]; }); return sum; }
function incomeH(){ var s = 0; ROOMS.forEach(function(r){ var t = tier(r.id); if (t>0) s += r.inc[t-1]; }); return s; }
function pending(){ var h = Math.min(CAP_H, (Date.now() - S.last)/3600000); return Math.floor(incomeH() * Math.max(0,h)); }
var PULSE = '<svg class="pulse" viewBox="0 0 560 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22 H150 L162 22 L172 7 L184 37 L196 13 L204 22 H330 L342 22 L352 9 L364 35 L376 15 L384 22 H560"/></svg>';
function heart(lost){ return '<svg class="'+(lost?'lost':'')+'" viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--bad)" d="M12 21s-7.5-4.6-9.6-9.1C1 8.9 2.7 5.5 6 5.5c2.1 0 3.4 1.1 4.2 2.3L12 10l1.8-2.2c.8-1.2 2.1-2.3 4.2-2.3 3.3 0 5 3.4 3.6 6.4C19.5 16.4 12 21 12 21z"/></svg>'; }

function topBar(){
  var l = levelOf(S.xp), cur = LV[l-1], next = LV[l];
  var frac = next ? (S.xp - cur)/(next - cur) : 1;
  var xpTxt = next ? (S.xp - cur)+' / '+(next-cur)+' опыта' : 'максимальный уровень';
  return '<div class="top"><div class="toprow"><span class="lvl">Ур. '+l+' · '+TITLES[l-1]+'</span><span class="money">'+fmt(S.money)+' ₽</span></div>' +
    '<div class="bar"><i style="transform:scaleX('+frac+')"></i></div><div class="note">'+xpTxt+'</div></div>';
}
function navBar(){
  var items = [["play","Приём"],["clinic","Клиника"],["bank","Вопросы"]];
  return '<div class="nav" id="nav">'+items.map(function(i){ return '<button data-v="'+i[0]+'" aria-current="'+(view===i[0])+'">'+i[1]+'</button>'; }).join("")+'</div>';
}
function shell(inner){
  stop3d(); clearInterval(ticker); ticker = null;
  app.innerHTML = '<div><p class="eyebrow">'+esc(S.name)+'</p></div>' + topBar() + navBar() + inner;
  document.getElementById("nav").onclick = function(e){ var v = e.target.getAttribute && e.target.getAttribute("data-v"); if (v){ view = v; flash = ""; render(); } };
}
function render(){ clearInterval(timer); if (view==="clinic") clinic(); else if (view==="bank") bank(); else home(); }

/* ===== Приём: старт ===== */
function home(){
  var p = pool(), lives = 3 + perk("life"), secs = 30 + perk("time"), hints = perk("hint");
  var chips = cats().map(function(c){ return '<button class="chip" aria-pressed="'+(c===cat)+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>'; }).join("");
  shell(
    PULSE +
    '<div class="panel"><p class="eyebrow">Раздел · вопросов в банке: '+p.length+'</p><div class="chips" id="chips">'+chips+'</div>' +
    '<button class="btn" id="go">Начать смену</button>' +
    '<p class="note">Лучшая смена: '+fmt(S.best)+' ₽ за один приём</p></div>' +
    '<ul class="rules"><li>10 вопросов. Жизней: '+lives+', на вопрос '+secs+' секунд'+(hints?', подсказок 50/50: '+hints:'')+'</li><li>Верный ответ даёт деньги и опыт, серия из 3 ответов подряд ×1,5, из 5 ×2</li><li>Деньги идут на оборудование клиники во вкладке «Клиника»</li><li>Клавиши 1–4 выбирают вариант ответа</li></ul>' +
    '<p class="note">Встроенные вопросы составлены для самоподготовки и не взяты из официального банка тестов. Свои вопросы можно загрузить во вкладке «Вопросы». Прогресс хранится в браузере на этом устройстве.</p>'
  );
  document.getElementById("chips").onclick = function(e){ var c = e.target.getAttribute && e.target.getAttribute("data-cat"); if (c){ cat = c; home(); } };
  document.getElementById("go").onclick = start;
}

/* ===== Игровая смена ===== */
function start(){
  var p = pool().filter(function(q){ return cat==="Все" || q.c===cat; });
  if (!p.length){ cat = "Все"; p = pool(); }
  var qs = shuffle(p).slice(0, 10);
  var lives = 3 + perk("life");
  st = { qs: qs, i: 0, lives: lives, maxLives: lives, earned: 0, xpGain: 0, streak: 0, ok: 0, per: {}, t0: 0, dur: 30 + perk("time"), hints: perk("hint"), lvlBefore: levelOf(S.xp), answered: false, opts: [] };
  question();
}
function hud(){
  var h = ""; for (var k=0;k<st.maxLives;k++) h += heart(k >= st.lives);
  var mult = st.streak>=5 ? "×2" : st.streak>=3 ? "×1,5" : "";
  return '<div class="hud"><div class="lives" id="lives" aria-label="Жизней: '+st.lives+'">'+h+'</div>' +
    '<div class="streak">'+(st.streak ? 'серия '+st.streak+(mult?' · '+mult:'') : '')+'</div>' +
    '<div class="score" id="score">+'+fmt(st.earned)+' ₽</div></div>';
}
function question(){
  stop3d();
  var q = st.qs[st.i];
  st.opts = shuffle(q.a); st.answered = false; st.t0 = Date.now();
  var o = st.opts.map(function(t,idx){ return '<button class="opt" data-i="'+idx+'"><span class="k">'+(idx+1)+'</span><span>'+esc(t)+'</span></button>'; }).join("");
  var canHint = st.hints > 0 && st.opts.length >= 3;
  app.innerHTML = hud() +
    '<div class="bar" id="bar"><i id="fill"></i></div>' +
    '<div class="qmeta"><span class="eyebrow">'+esc(q.c)+'</span><span class="eyebrow">'+(st.i+1)+' / '+st.qs.length+'</span></div>' +
    '<h2 class="qtext">'+esc(q.q)+'</h2>' +
    '<div class="opts" id="opts">'+o+'</div><div id="after">' +
    (canHint ? '<button class="btn ghost small" id="hint">Подсказка 50/50 (осталось '+st.hints+')</button>' : '') + '</div>';
  document.getElementById("opts").onclick = function(e){ var b = e.target.closest(".opt"); if (b && !b.disabled) answer(parseInt(b.getAttribute("data-i"),10)); };
  var hb = document.getElementById("hint"); if (hb) hb.onclick = useHint;
  clearInterval(timer);
  timer = setInterval(tick, 100);
}
function useHint(){
  if (st.answered || st.hints<=0) return;
  var right = st.qs[st.i].a[0], wrong = [];
  st.opts.forEach(function(t,i){ if (t!==right) wrong.push(i); });
  var kill = shuffle(wrong).slice(0, Math.min(2, wrong.length-1));
  var btns = document.querySelectorAll(".opt");
  kill.forEach(function(i){ btns[i].disabled = true; btns[i].classList.add("off"); });
  st.hints--;
  document.getElementById("after").innerHTML = "";
}
function tick(){
  var left = Math.max(0, st.dur - (Date.now() - st.t0)/1000);
  var f = document.getElementById("fill"), bar = document.getElementById("bar");
  if (f) f.style.transform = "scaleX("+(left/st.dur)+")";
  if (bar) bar.classList.toggle("low", left < 8);
  if (left <= 0) answer(-1);
}
function answer(idx){
  if (st.answered) return;
  st.answered = true; clearInterval(timer);
  var q = st.qs[st.i], right = q.a[0];
  var secs = (Date.now() - st.t0)/1000;
  var isOk = idx>=0 && st.opts[idx] === right;
  st.per[q.c] = st.per[q.c] || [0,0]; st.per[q.c][1]++;
  var gain = 0;
  if (isOk){
    st.ok++; st.per[q.c][0]++; st.streak++;
    var base = 40 + Math.round(Math.max(0, 1 - secs/st.dur) * 20);
    var m = (st.streak>=5 ? 2 : st.streak>=3 ? 1.5 : 1) * (1 + perk("money")/100);
    gain = Math.round(base*m); st.earned += gain; st.xpGain += 10;
    S.money += gain; S.xp += 10;
  } else { st.streak = 0; st.lives--; }
  save();
  document.querySelectorAll(".opt").forEach(function(b,i){ b.disabled = true; if (st.opts[i]===right) b.classList.add("good"); else if (i===idx) b.classList.add("bad"); });
  var over = st.lives<=0, last = st.i >= st.qs.length-1;
  var head = isOk ? "Верно, +"+gain+" ₽" : (idx<0 ? "Время вышло" : "Неверно");
  var body = (isOk ? "" : "<p>Правильный ответ: "+esc(right)+"</p>") + (q.e ? "<p>"+esc(q.e)+"</p>" : "");
  document.getElementById("after").innerHTML =
    '<div class="fb '+(isOk?'good':'bad')+'"><b>'+head+'</b>'+body+'</div>' +
    '<button class="btn" id="next" style="margin-top:12px">'+((over||last)?'Итоги смены':'Следующий вопрос')+'</button>';
  var n = document.getElementById("next");
  n.onclick = function(){ if (over||last) finish(); else { st.i++; question(); } };
  n.focus();
  var h = ""; for (var k=0;k<st.maxLives;k++) h += heart(k >= st.lives);
  document.getElementById("lives").innerHTML = h;
  document.getElementById("score").textContent = "+"+fmt(st.earned)+" ₽";
}
function finish(){
  clearInterval(timer);
  var total = st.i + 1;
  if (st.lives > 0){ st.xpGain += 20; S.xp += 20; }
  if (st.earned > S.best) S.best = st.earned;
  save();
  var lAfter = levelOf(S.xp), up = "";
  if (lAfter > st.lvlBefore){
    var opened = ROOMS.filter(function(r){ return r.min > st.lvlBefore && r.min <= lAfter; }).map(function(r){ return r.name; });
    up = '<div class="up"><b>Новый уровень: '+lAfter+' · '+TITLES[lAfter-1]+'</b>' + (opened.length ? '<p>Можно построить: '+opened.join(", ")+'</p>' : '') + '</div>';
  }
  var title = st.lives<=0 ? "Смена прервана" : "Смена закончена";
  var topics = Object.keys(st.per).map(function(c){
    var a = st.per[c], p = a[0]/a[1];
    return '<div class="topic"><span>'+esc(c)+'</span><em>'+a[0]+' из '+a[1]+'</em><div class="bar"><i style="transform:scaleX('+p+')"></i></div></div>';
  }).join("");
  view = "play";
  shell(
    '<p class="eyebrow">'+title+'</p>' + PULSE + up +
    '<div class="panel"><div class="big">+'+fmt(st.earned)+' ₽</div><p class="note">Опыт за смену: +'+st.xpGain+'</p>' +
    '<div class="stats"><div class="stat"><b>'+st.ok+' / '+total+'</b><span>верных ответов</span></div><div class="stat"><b>'+st.lives+'</b><span>жизней осталось</span></div><div class="stat"><b>'+Math.round(st.ok/total*100)+'%</b><span>точность</span></div></div></div>' +
    '<div class="panel"><p class="eyebrow">Результат по темам</p><div class="topics">'+topics+'</div></div>' +
    '<button class="btn" id="again">Новая смена</button><button class="btn ghost" id="toclinic">В клинику</button>'
  );
  document.getElementById("again").onclick = start;
  document.getElementById("toclinic").onclick = function(){ view = "clinic"; render(); };
}
document.addEventListener("keydown", function(e){
  if (!st || st.answered || !document.getElementById("opts")) return;

/* ===== Клиника ===== */
function clinic(){
  var l = levelOf(S.xp);
  var pts = 0, stf = 0; ROOMS.forEach(function(r){ var t = tier(r.id); if (t>0){ pts += t+1; stf += t>1 ? 2 : 1; } });
  var cards = ROOMS.map(function(r){
    var t = tier(r.id), locked = t===0 && l < r.min;
    var pips = [0,1,2].map(function(i){ return '<span class="pip '+(i<t?'on':'')+'"></span>'; }).join("");
    var lines = "";
    if (t>0) lines += '<p class="rline">'+esc(r.tiers[t-1][0])+' · '+r.inc[t-1]+' ₽ в час'+(r.perk ? ' · +'+r.perk.v[t-1]+' '+r.perk.txt : '')+'</p>';
    else lines += '<p class="rline">'+(locked ? 'Откроется на уровне '+r.min+' ('+TITLES[r.min-1]+')' : 'Не построена')+'</p>';
    var btn = "";
    if (t>=3) btn = '<button class="btn ghost small" disabled>Максимальное оснащение</button>';
    else if (locked) btn = '<button class="btn ghost small" disabled>Нужен уровень '+r.min+'</button>';
    else {
      var nx = r.tiers[t], can = S.money >= nx[1];
      btn = '<button class="btn small" data-buy="'+r.id+'"'+(can?'':' disabled')+'>'+(t===0?'Построить':'Улучшить')+': '+esc(nx[0])+' · '+fmt(nx[1])+' ₽</button>';
    }
    return '<div class="room '+(locked?'locked':'')+'"><div class="rhead"><h3>'+esc(r.name)+'</h3><div class="pips">'+pips+'</div></div>'+lines+btn+'</div>';
  }).join("");
  shell(
    '<div class="nav" id="mode" style="grid-template-columns:repeat(2,1fr)"><button data-m="2d" aria-current="'+(clinicMode==="2d")+'">Схема</button><button data-m="3d" aria-current="'+(clinicMode==="3d")+'">3D</button></div>' +
    '<div class="panel art">'+(clinicMode==="3d" ? '<div id="stage3d"></div>' : clinicArt())+'<p class="rline" id="event" style="padding:0 8px">'+esc(pickEvent())+'</p><p class="note" style="padding:0 8px 4px">Сейчас в клинике: пациентов '+pts+', сотрудников '+stf+(clinicMode==="3d" ? ' · вращайте здание пальцем, масштаб щипком' : '')+'</p></div>' +
    '<div class="panel"><div class="collect"><div><p class="eyebrow">Выручка за время простоя</p><div class="big" id="pend">'+fmt(pending())+' ₽</div><p class="note">Клиника приносит '+fmt(incomeH())+' ₽ в час, копится до '+CAP_H+' часов</p></div>' +
    '<button class="btn small" id="collect" style="width:auto">Забрать</button></div>' +
    (flash ? '<p class="msg" style="color:var(--good)">'+flash+'</p>' : '') + '</div>' +
    '<div class="panel"><p class="eyebrow">Название клиники</p>' +
    '<input type="text" id="cname" maxlength="32" value="'+esc(S.name)+'" aria-label="Название клиники"></div>' +
    '<div class="rooms" id="rooms">'+cards+'</div>'
  );
  ticker = setInterval(function(){ var el = document.getElementById("pend"); if (el) el.textContent = fmt(pending())+" ₽"; var ev = document.getElementById("event"); if (ev) ev.textContent = pickEvent(); }, 4500);
  document.getElementById("mode").onclick = function(e){ var m = e.target.getAttribute && e.target.getAttribute("data-m"); if (m && m !== clinicMode){ clinicMode = m; clinic(); } };
  if (clinicMode === "3d") init3d(document.getElementById("stage3d"));
  document.getElementById("collect").onclick = function(){
    var p = pending();
    if (p>0){ S.money += p; S.last = Date.now(); save(); flash = "Получено "+fmt(p)+" ₽"; } else { flash = "Пока нечего забирать"; }
    clinic();
  };
  document.getElementById("cname").onchange = function(e){ var v = e.target.value.trim(); if (v){ S.name = v.slice(0,32); save(); document.querySelector(".eyebrow").textContent = S.name; } };
  document.getElementById("rooms").onclick = function(e){
    var id = e.target.getAttribute && e.target.getAttribute("data-buy"); if (!id) return;
    var r = ROOMS.filter(function(x){ return x.id===id; })[0], t = tier(id), nx = r.tiers[t];
    if (!nx || S.money < nx[1] || (t===0 && l < r.min)) return;
    var p = pending(); S.money += p; S.last = Date.now();
    S.money -= nx[1]; S.rooms[id] = t+1; save();
    flash = (t===0 ? "Построено: " : "Установлено: ") + (t===0 ? r.name+" — " : "")+nx[0];
    clinic();
  };
}

/* ===== Банк вопросов: импорт своих ===== */
function parseBank(text){
  var lines = text.replace(/\r/g,"").split("\n"), out = [], bad = 0, curCat = "Мои вопросы", cur = null;
  function flush(){
    if (!cur) return;
    if (cur.q && cur.right !== null && cur.wrong.length >= 1 && cur.wrong.length <= 5) out.push({ c: cur.c, q: cur.q, a: [cur.right].concat(cur.wrong), e: cur.e });
    else bad++;
    cur = null;
  }
  lines.forEach(function(raw){
    var s = raw.trim();
    if (!s){ flush(); return; }
    if (s.charAt(0)==="#" && !cur){ curCat = s.replace(/^#+\s*/,"") || "Мои вопросы"; return; }
    if (!cur) cur = { c: curCat, q: "", right: null, wrong: [], e: "" };
    if (s.charAt(0)==="+"){ var t = s.slice(1).trim(); if (cur.right === null) cur.right = t; else cur.wrong.push(t); }
    else if (s.charAt(0)==="-"){ cur.wrong.push(s.slice(1).trim()); }
    else if (s.charAt(0)==="="){ cur.e = s.slice(1).trim(); }
    else if (!cur.wrong.length && cur.right===null){ cur.q += (cur.q ? " " : "") + s; }
  });
  flush();
  return { ok: out, bad: bad };
}
function bank(){
  var cnt = CUSTOM.length;
  shell(
    '<div class="panel"><p class="eyebrow">Свои вопросы</p><p>Загружено: <b>'+cnt+'</b>. Они появятся в списке разделов рядом со встроенными и хранятся только в этом браузере.</p>' +
    '<p class="note">Формат: вопрос, затем варианты. Верный вариант начинается с «+», неверные с «-». Строка с «=» даёт пояснение. Вопросы разделяются пустой строкой, строка «# Тема» задаёт раздел.</p>' +
    '<pre># Эпидемиология\nКакой путь передачи характерен для гепатита А?\n+ Фекально-оральный\n- Парентеральный\n- Трансмиссивный\n= Заражение через воду, пищу и руки.</pre>' +
    '<textarea id="paste" placeholder="Вставьте вопросы сюда" aria-label="Текст с вопросами"></textarea>' +
    '<input type="file" id="file" accept=".txt,text/plain" aria-label="Файл .txt с вопросами">' +
    '<button class="btn" id="add">Добавить в банк</button>' +
    '<button class="btn ghost" id="clear"'+(cnt?'':' disabled')+'>Удалить загруженные вопросы</button>' +
    '<p class="msg" id="msg" aria-live="polite">'+(flash ? esc(flash) : '')+'</p></div>'
  );
  var msg = document.getElementById("msg");
  document.getElementById("file").onchange = function(e){
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){ document.getElementById("paste").value = String(rd.result); msg.textContent = "Файл прочитан, нажмите «Добавить в банк»."; };
    rd.onerror = function(){ msg.textContent = "Не удалось прочитать файл."; };
    rd.readAsText(f, "utf-8");
  };
  document.getElementById("add").onclick = function(){
    var r = parseBank(document.getElementById("paste").value);
    if (!r.ok.length){ msg.textContent = "Не нашлось ни одного вопроса в нужном формате. Проверьте, что у каждого вопроса есть один вариант с «+» и хотя бы один с «-»."; return; }
    var prev = CUSTOM; CUSTOM = CUSTOM.concat(r.ok);
    if (!saveBank()){ CUSTOM = prev; msg.textContent = "Браузер не дал сохранить столько вопросов. Загрузите меньший файл."; return; }
    flash = "Добавлено вопросов: "+r.ok.length+(r.bad ? ", пропущено с ошибками: "+r.bad : "");
    cat = "Все"; bank();
  };
  document.getElementById("clear").onclick = function(){ CUSTOM = []; saveBank(); cat = "Все"; flash = "Загруженные вопросы удалены"; bank(); };
}
